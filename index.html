<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Meaning Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px 25px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #334155;
      border-radius: 8px;
      background-color: #0f172a;
      color: #ffffff;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    /* Word List Container */
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .word-card {
      display: flex;
      align-items: center;
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 12px 16px;
      border-radius: 8px;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    .letter-badge {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      width: 40px;
      height: 40px;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      flex-shrink: 0;
    }

    .word-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Name Acrostic Generator</h1>
    <p class="subtitle">Enter a name to discover its uplifting attributes!</p>

    <div class="input-group">
      <input type="text" id="nameInput" placeholder="Enter a name..." maxlength="15" value="ALEX">
      <button onclick="generateMeaning()">Generate</button>
    </div>

    <div class="word-list" id="resultContainer"></div>
  </div>

  <script>
    // Dictionary of positive, meaningful words for each letter
    const wordDictionary = {
      A: ["Admirable", "Authentic", "Ambitious", "Artistic", "Affectionate"],
      B: ["Brilliant", "Brave", "Beloved", "Bold", "Bountiful"],
      C: ["Compassionate", "Charismatic", "Creative", "Courageous", "Charming"],
      D: ["Dazzling", "Determined", "Dynamic", "Devoted", "Delightful"],
      E: ["Empathetic", "Energetic", "Elegant", "Extraordinary", "Enthusiastic"],
      F: ["Fearless", "Friendly", "Faithful", "Fascinating", "Forgiving"],
      G: ["Generous", "Gracious", "Genuine", "Gifted", "Gentle"],
      H: ["Honest", "Harmonious", "Heroic", "Heartfelt", "Hopeful"],
      I: ["Inspiring", "Intelligent", "Insightful", "Incredible", "Imaginative"],
      J: ["Joyful", "Jubilant", "Just", "Jovial", "Judicious"],
      K: ["Kindhearted", "Keen", "Knowledgeable", "Kinetic", "Kinglike"],
      L: ["Luminous", "Loyal", "Loving", "Legendary", "Logical"],
      M: ["Magnificent", "Mindful", "Motivated", "Merciful", "Magical"],
      N: ["Noble", "Nurturing", "Noteworthy", "Nice", "Navigate"],
      O: ["Optimistic", "Original", "Outstanding", "Openhearted", "Organized"],
      P: ["Passionate", "Peaceful", "Persevering", "Polite", "Phenomenal"],
      Q: ["Quick-witted", "Queenly", "Quietly-confident", "Qualitied", "Quaint"],
      R: ["Resilient", "Radiant", "Respectful", "Resourceful", "Reliable"],
      S: ["Sincere", "Sppirited", "Strong", "Splendid", "Supportive"],
      T: ["Trustworthy", "Thoughtful", "Talented", "Tenacious", "Triumphant"],
      U: ["Unstoppable", "Unique", "Understanding", "Uplifting", "Ultimate"],
      V: ["Vibrant", "Valiant", "Visionary", "Versatile", "Victorious"],
      W: ["Wise", "Warmhearted", "Wonderful", "Witty", "Welcoming"],
      X: ["Xtraordinary", "Xenial (Hospitable)", "Xanthic (Bright)", "X-factor"],
      Y: ["Youthful", "Yearning", "Yielding-kindness", "Yummy-spirited"],
      Z: ["Zealous", "Zestful", "Zen", "Zippy", "Zeal-filled"]
    };

    function getRandomWord(letter) {
      const upperLetter = letter.toUpperCase();
      const options = wordDictionary[upperLetter];
      if (options && options.length > 0) {
        // Pick a random word from the array so results feel fresh!
        return options[Math.floor(Math.random() * options.length)];
      }
      return "Special"; // Fallback
    }

    function generateMeaning() {
      const nameInput = document.getElementById('nameInput').value.trim();
      const container = document.getElementById('resultContainer');
      
      container.innerHTML = ''; // Clear previous results

      // Clean string (only letters)
      const cleanName = nameInput.replace(/[^a-zA-JS-Za-z]/g, '');

      if (!cleanName) {
        container.innerHTML = '<p style="color: #ef4444; text-align: center;">Please enter a valid name!</p>';
        return;
      }

      // Loop through each character
      Array.from(cleanName).forEach((char, index) => {
        const word = getRandomWord(char);

        // Create card element
        const card = document.createElement('div');
        card.className = 'word-card';
        card.style.animationDelay = `${index * 0.1}s`; // Stagger animation

        card.innerHTML = `
          <div class="letter-badge">${char.toUpperCase()}</div>
          <div class="word-text">${word}</div>
        `;

        container.appendChild(card);
      });
    }

    // Generate initial result on page load
    generateMeaning();
  </script>

</body>
</html>
